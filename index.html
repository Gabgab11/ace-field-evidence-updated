<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACE Field Evidence · Digital MRV</title>
<style>
:root{
  --bg:#F8F9FA; --surface:rgba(255,255,255,0.7); --soft:rgba(240,243,238,0.5); --line:rgba(229,234,227,0.3);
  --ink:#0E1A14; --text:#0E1A14; --paper:#0E1A14; --canopy:#0E1A14; --canopy2:#FFFFFF; --canopy3:rgba(240,243,238,0.8);
  --muted:#6B7A70; --green:#2F7D4F; --moss:#2F7D4F; --green-soft:rgba(227,241,231,0.6);
  --ochre:#E0A93B; --sky:#2F6F92; --clay:#B5472C;
  --r-card:24px; --r-ctl:14px; --r-pill:999px;
  --serif:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
  --sans:"Inter","Helvetica Neue",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 8px 32px rgba(14,26,20,.08),0 2px 8px rgba(14,26,20,.04);
  --blur:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1419; --surface:rgba(20,30,28,0.6); --soft:rgba(30,50,45,0.4); --line:rgba(107,122,112,0.2);
    --ink:#F5F6F2; --text:#F5F6F2; --muted:#9BA69D; --green-soft:rgba(47,125,79,0.3);
    --shadow:0 8px 32px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.1);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{font-family:var(--sans);font-weight:700;letter-spacing:-.03em;color:var(--ink)}
h1{font-size:40px;line-height:1.08}
h2{font-size:28px;line-height:1.15}
h3{font-size:16px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(360px,520px) 1fr;background:var(--surface)}
.login-form{padding:48px 56px;display:flex;flex-direction:column;justify-content:center;gap:0}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:56px}
.brandrow b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brandrow small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.mark{width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em;flex:0 0 auto}
.login h1 .hl{color:var(--green)}
.login .lede{color:var(--muted);font-size:16px;margin:16px 0 32px;max-width:40ch}
.login-card{width:100%;max-width:400px}
.login-card .sub{display:none}
.login-art{position:relative;background:var(--art) center bottom/cover no-repeat;overflow:hidden;min-height:100vh}
.floatcard{position:absolute;background:var(--surface);border-radius:18px;box-shadow:0 18px 40px rgba(14,26,20,.14);padding:16px 18px;min-width:230px}
.floatcard small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:4px}
.floatcard b{display:block;font-size:17px;letter-spacing:-.02em}
.floatcard span{color:var(--muted);font-size:13px}
.floatcard.c1{top:18%;left:14%}
.floatcard.c2{top:44%;right:10%}
.floatcard.c3{bottom:14%;left:24%}
.floatcard .ok{color:var(--green);font-weight:700}
@media(max-width:900px){.login{grid-template-columns:1fr}.login-art{display:none}.login-form{padding:32px 24px}h1{font-size:32px}}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label,.lbl{color:var(--ink);font-size:13.5px;font-weight:600}
input,select,textarea{width:100%;background:var(--surface);border:1px solid #D9E0D6;border-radius:var(--r-ctl);padding:12px 14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#9AA69D}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
input:disabled{background:var(--soft);color:var(--muted)}
select{width:auto;min-width:180px;cursor:pointer}
textarea{resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #D9E0D6;background:var(--surface);padding:11px 18px;border-radius:var(--r-pill);cursor:pointer;color:var(--ink);font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:#B9C4BA;background:#FAFBF9}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:#1B2B22;border-color:#1B2B22}
.btn.moss{background:var(--green);border-color:var(--green);color:var(--on-ink)}
.btn.danger{color:var(--clay);border-color:#EBC9BF;background:#FDF6F3}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.block{width:100%;padding:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;color:var(--green);cursor:pointer;padding:0;font-size:13px;font-weight:600}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);backdrop-filter:blur(var(--blur));border-right:1px solid var(--line);padding:32px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 30px}
.brand b{font-size:16px;font-weight:700;display:block;line-height:1.15;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:12.5px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:11px 14px;border-radius:14px;color:var(--muted);cursor:pointer;text-align:left;font-size:14.5px;font-weight:600}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--on-ink)}
.nav .badge{background:var(--ochre);color:var(--ink);border-radius:var(--r-pill);font-size:11.5px;font-weight:800;padding:1px 8px;min-width:22px;text-align:center}
.nav .sep{height:1px;background:var(--line);margin:14px 6px}
.nav .short{display:none}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--soft);border:0;cursor:pointer;width:100%;text-align:left}
.me:hover{background:#E8EDE5}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:13.5px;flex:0 0 auto}
.me b{display:block;font-size:14px}
.me small{color:var(--muted);font-size:12.5px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 40px;background:var(--surface);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.topbar .crumb{color:var(--muted);font-size:13.5px;font-weight:500}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid #D9E0D6;border-radius:var(--r-pill);padding:9px 16px;min-width:280px}
.search span{color:var(--muted);font-size:13.5px;font-weight:600}
.search input{border:0;background:none;padding:0;width:100%;box-shadow:none}
.search input:focus{border:0;box-shadow:none}
.roletag{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:var(--r-pill);background:var(--green-soft);color:var(--green)}
.content{padding:32px 48px 80px;max-width:1280px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:8px 0 28px}
.pagehead p{color:var(--muted);margin-top:8px;max-width:60ch;font-size:15.5px}

/* Mobile: bottom pill bar */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:12px;right:12px;bottom:12px;top:auto;height:auto;border:0;border-radius:24px;padding:8px;box-shadow:0 14px 40px rgba(14,26,20,.18);z-index:30;flex-direction:row;background:var(--ink)}
  .side .brand,.side .sep,.side .me{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;gap:2px}
  .nav button{flex-direction:column;justify-content:center;gap:2px;padding:9px 2px;font-size:10.5px;color:#AFC0B4;text-align:center;border-radius:18px;flex:1;white-space:nowrap;min-width:0}
  .nav button:hover{background:rgba(255,255,255,.06);color:var(--on-ink)}
  .nav button.on{background:rgba(255,255,255,.12);color:var(--on-ink)}
  .nav .m-hide{display:none!important}
  .nav .full{display:none}
  .nav .short{display:inline}
  .nav .badge{position:absolute;top:0;right:10px;margin:0;padding:0 5px;font-size:9.5px;line-height:15px}
  .nav button{position:relative}
  .topbar{padding:14px 20px}
  .search{display:none}
  .content{padding:4px 18px 120px}
  h1{font-size:30px}
  .pagehead{margin:4px 0 20px}
  .main{padding-bottom:0}
}

/* ---------- Cards ---------- */
.card{background:var(--surface);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:var(--r-card);padding:28px;box-shadow:var(--shadow);transition:all .2s ease}
.card:hover{background:rgba(255,255,255,0.75);backdrop-filter:blur(calc(var(--blur) * 1.2))}
.card.flat{background:transparent;box-shadow:none;backdrop-filter:none}
.grid{display:grid;gap:20px}
.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.dash{grid-template-columns:1.5fr 1fr}
.dash2{grid-template-columns:1fr 1fr}
@media(max-width:1080px){.dash,.dash2{grid-template-columns:1fr}}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.cardhead small{color:var(--muted);font-size:13px;font-weight:500}
.kpi .lbl{color:var(--muted);font-size:13.5px;font-weight:600}
.kpi .num{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:10px 0 6px}
.kpi svg{display:block;margin-top:14px;width:100%;height:40px}

/* Hero band */
.hero-band{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;margin-bottom:24px;align-items:stretch}
@media(max-width:1080px){.hero-band{grid-template-columns:1fr}}
.hero-band .intro{position:relative;overflow:hidden;padding:30px;border-radius:var(--r-card);background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.92) 62%,#fff 100%),var(--art) center 40%/cover no-repeat;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;gap:22px;min-height:300px;box-shadow:var(--shadow)}
.hero-band .intro h2{font-size:32px;margin-bottom:10px}
.hero-band .intro p{color:#3F4F45;max-width:44ch;font-size:15.5px}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;overflow:hidden;box-shadow:var(--shadow)}
.mapcard svg{width:100%;height:auto;display:block;border-radius:14px;background:#F7F9F5}
.mapcard text{font-family:var(--sans);fill:var(--muted);font-size:11px;font-weight:600}
.mapcard .pl{fill:var(--ink);font-size:12px}
.mapcard .pt{cursor:pointer}
.mapcard .pt text{opacity:0;fill:var(--ink);transition:opacity .15s}
.mapcard .pt:hover text,.mapcard .pt:focus text{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;padding:12px 4px 2px;font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* Pipeline bars */
.pipe{display:grid;grid-template-columns:160px 1fr 30px;gap:14px;align-items:center;margin-bottom:14px;font-size:14px}
.pipe .track{height:10px;border-radius:var(--r-pill);background:var(--soft);overflow:hidden}
.pipe .track i{display:block;height:100%;border-radius:var(--r-pill);background:var(--ink);transition:width .5s}
.pipe b{text-align:right;font-weight:700}
.srcbar{background:var(--green)!important}

/* Pills */
.pill{display:inline-block;padding:4px 11px;border-radius:var(--r-pill);font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--soft)}
.pill.draft{color:var(--muted);background:var(--soft)}
.pill.submitted{color:var(--sky);background:#E6F0F6}
.pill.changes{color:#8A5A00;background:#FBF1DC}
.pill.verified{color:var(--green);background:var(--green-soft)}
.pill.rejected{color:var(--clay);background:#FBE9E3}
.dot{width:12px;height:12px;border-radius:50%;background:#B9C4BA;flex:0 0 auto;margin-top:4px}
.dot.ok{background:var(--green);box-shadow:0 0 0 6px var(--green-soft)}
.dot.bad{background:var(--clay);box-shadow:0 0 0 6px #FBE9E3}
.state{display:flex;gap:12px;align-items:flex-start}
.state b{font-size:15.5px}

/* Activity and feed */
.act{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.act:last-child{border:0}
.act .ic{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;color:var(--ink);font-weight:700}
.act b{font-size:14.5px;font-weight:650}
.act small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.feed{display:grid;grid-template-columns:1fr auto;gap:14px 16px;align-items:baseline}
.feed .n{color:#3F4F45;font-size:14.5px}
.feed .v{font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:right}
.feed .u{color:var(--muted);font-size:12.5px;margin-left:4px;font-weight:600}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:12.5px;font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* Checks */
.checks{display:flex;flex-direction:column;gap:14px}
.chk{display:grid;grid-template-columns:26px 1fr;gap:12px;font-size:14.5px;font-weight:600}
.chk small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.chk .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.chk .m.ok{background:var(--green-soft);color:var(--green)}
.chk .m.no{background:#FBE9E3;color:var(--clay)}
.chk .m.na{background:var(--soft);color:var(--muted)}
.code{font-size:12.5px;color:var(--muted);background:var(--soft);padding:10px 12px;border-radius:12px;word-break:break-all;margin-top:10px;font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* Tables */
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
.table th{color:var(--muted);font-weight:600;font-size:13px}
.table tr.row{cursor:pointer}
.table tr.row:hover td{background:#FAFBF9}
.table .flag{color:var(--clay);font-weight:700}
.table .clear{color:var(--green);font-weight:600}
.tablewrap{overflow-x:auto;padding:4px 8px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar select{min-width:190px}
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;background:var(--soft);padding:5px;border-radius:var(--r-pill);width:fit-content}
.tabs button{background:none;border:0;padding:9px 16px;color:var(--muted);cursor:pointer;border-radius:var(--r-pill);font-weight:600;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,26,20,.1)}

/* Project cards */
.projects{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.proj h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.proj .meta{color:var(--muted);font-size:14px;line-height:1.7}
.proj .stats{display:flex;gap:26px;margin:20px 0}
.proj .stats div{color:var(--muted);font-size:12.5px;font-weight:600}
.proj .stats b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.proj .bar{height:8px;border-radius:var(--r-pill);background:var(--soft);overflow:hidden;margin-top:4px}
.proj .bar i{display:block;height:100%;background:var(--green)}

/* Forms in pages */
.formsec{display:grid;gap:16px;margin-bottom:30px}
.formsec h3{font-size:17px;margin-bottom:-2px}
.formmsg{color:var(--clay);font-size:14px;min-height:20px;font-weight:600}
.notice{border-radius:var(--r-ctl);padding:14px 18px;background:#FDF6E8;color:#6E4C00;font-weight:500}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:14.5px}

/* Record detail */
.kv{display:grid;grid-template-columns:170px 1fr;gap:14px 20px;margin-bottom:22px}
.kv dt{color:var(--muted);font-size:13.5px;font-weight:600}
.kv dd{font-size:15px}
.review{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:14px}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.ev div{background:var(--soft);border-radius:16px;overflow:hidden}
.ev img{width:100%;height:96px;object-fit:cover;display:block}
.ev .d{height:96px;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px}
.ev small{display:block;padding:9px 11px;color:var(--muted);font-size:12.5px;word-break:break-all;font-weight:500}
.hist .h{padding:14px 0;border-bottom:1px solid var(--line)}
.hist .h:last-child{border:0}
.hist small{color:var(--muted);display:block;font-size:13px;margin-top:2px}
.hist p{font-size:14.5px;margin-top:6px}

/* Profile */
.profile-top{display:flex;align-items:center;gap:22px;padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:22px;flex-wrap:wrap;box-shadow:var(--shadow)}
.profile-top .avatar{width:78px;height:78px;font-size:26px}
.profile-top h2{font-size:30px}
.profile-top p{color:var(--muted);font-size:15px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
.kvs div{color:var(--muted);font-size:13px;font-weight:600}
.kvs b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}

/* Settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:22px;padding:18px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow p{color:var(--muted);font-size:14px;margin-top:3px;max-width:56ch}
.setrow b{font-size:15.5px}
.switch{position:relative;width:48px;height:28px;border-radius:var(--r-pill);background:#D6DDD4;border:0;cursor:pointer;flex:0 0 auto;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--on-ink);padding:13px 18px;border-radius:16px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:360px;z-index:40;box-shadow:0 14px 34px rgba(14,26,20,.25);font-weight:600;font-size:14.5px}
.toast.show{opacity:1;transform:none}
@media(max-width:900px){.toast{bottom:104px;left:18px;right:18px;max-width:none}}


:root{ --on-ink:#fff; --topbg:rgba(245,246,242,.85); }
[data-theme="dark"]{
  --bg:#0B1510; --surface:#132219; --soft:#1A2D22; --line:#284036; --ink:#EEF3EC; --text:#EEF3EC; --paper:#EEF3EC; --canopy:#EEF3EC; --canopy2:#132219; --canopy3:#1A2D22;
  --muted:#9AB0A2; --green:#5CB880; --moss:#5CB880; --green-soft:#1D3B2A; --sky:#8CC4E0; --clay:#E08A72;

}
[data-theme="dark"] .pill.submitted{background:#15303F;color:#8CC4E0}
[data-theme="dark"] .pill.changes{background:#3A2C0E;color:#F0C56A}
[data-theme="dark"] .pill.rejected{background:#3D221A;color:#E08A72}
[data-theme="dark"] .btn.danger{background:#2A1A15}
[data-theme="dark"] .notice{background:#2E2510;color:#F0C56A}
[data-theme="dark"] .mapcard svg{background:var(--soft)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{border-color:#2E4A3C}

[data-theme="dark"] .switch{background:#2E4A3C}
.topbar{background:var(--topbg)}
.mark,.btn.primary,.btn.moss,.nav button.on,.avatar{color:var(--on-ink)}

/* Tree toggle: three leaves on a branch */
.tree{position:relative;display:flex;align-items:flex-end;gap:10px;padding:14px 12px 26px;background:var(--soft);border-radius:20px;max-width:520px}
.tree::before{content:"";position:absolute;left:10%;right:10%;bottom:14px;height:3px;border-radius:3px;background:var(--muted);opacity:.45}
.tree::after{content:"";position:absolute;left:50%;bottom:0;width:6px;height:16px;margin-left:-3px;border-radius:4px 4px 0 0;background:var(--muted);opacity:.45}
.leaf{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface);color:var(--muted);padding:12px 14px;border-radius:2px 22px 2px 22px;font-weight:650;font-size:14px;cursor:pointer;box-shadow:var(--shadow);transition:background .2s,color .2s,transform .2s;z-index:1}
.leaf::after{content:"";position:absolute;left:50%;bottom:-13px;width:2px;height:12px;margin-left:-1px;background:var(--muted);opacity:.5}
.leaf svg{width:16px;height:16px;flex:0 0 auto}
.leaf:hover{color:var(--ink)}
.leaf.on{background:var(--green);color:#fff;transform:translateY(-3px)}
.leaf.on::after{background:var(--green);opacity:1}
.tree.compact{padding:6px 8px 16px;gap:6px;max-width:none;border-radius:16px}
.tree.compact::before{bottom:10px}
.tree.compact::after{height:10px}
.tree.compact .leaf{padding:7px 11px;font-size:12.5px;gap:6px;box-shadow:none}
.tree.compact .leaf::after{bottom:-9px;height:8px}
.tree.compact .leaf.on{transform:translateY(-2px)}
.tree.compact .leaf svg{width:13px;height:13px}
.themebox{display:grid;gap:14px;max-width:560px}
.timerow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.timerow input[type=time]{width:auto;min-width:130px}

/* Splash */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.gone{opacity:0;visibility:hidden}
.splash-mark{width:84px;height:84px;border-radius:26px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;font-size:24px;letter-spacing:.02em;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 18px 40px rgba(14,26,20,.18)}
.splash-name{font-weight:700;font-size:24px;letter-spacing:-.03em;animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both}
.splash-sub{color:var(--muted);font-size:14.5px;font-weight:500;animation:rise .9s .25s cubic-bezier(.2,.8,.2,1) both}
.splash-bar{width:200px;height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:14px}
.splash-bar i{display:block;height:100%;width:0;background:var(--green);animation:fill 2.4s ease forwards}
.splash-hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.splash-leaf{position:absolute;bottom:14%;width:26px;height:26px;border-radius:2px 14px 2px 14px;background:var(--green);opacity:.85;animation:sway 3s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.splash-mark,.splash-name,.splash-sub,.splash-leaf{animation:none}.splash-bar i{animation:none;width:100%}}

/* Mobile bar: light and dark friendly */
@media(max-width:900px){
  .side{background:var(--surface);border:1px solid var(--line)}
  .nav button{color:var(--muted)}
  .nav button:hover{background:var(--soft);color:var(--ink)}
  .nav button.on{background:var(--ink);color:var(--on-ink)}
  .tree.compact{display:none}
}

/* v4: splash then clean sign-in */
#root{opacity:0}
#root.show{opacity:1;transition:opacity .45s ease}
#splash{position:fixed;inset:0;z-index:100;background:#F7F3E6;overflow:hidden}

.signin-card .demo select{min-width:160px}
.signin-foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}

.chip{border:1px solid transparent;border-radius:999px;padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:600;line-height:1;cursor:pointer;white-space:nowrap;transition:transform .1s,filter .1s}

  else { const v = +r.value; out.push(v>=rng[0]&&v<=rng[1] ? { ok:true, label:'Value in expected range', note:`${rng[0]} to ${rng[1]} ${r.unit}` } : { ok:false, label:'Value outside expected range', note:`Expected ${rng[0]} to ${rng[1]}, recorded ${v}` }); }
  const p = projOf(r.projectId), d = km(p.c[0], p.c[1], r.lat, r.lon);
  out.push(d<=30 ? { ok:true, label:'Inside project boundary', note:`${d.toFixed(1)} km from project centre` } : { ok:false, label:'Outside project boundary', note:`${d.toFixed(1)} km from centre, limit 30 km` });
  const dateOk = r.date >= r.periodStart && r.date <= r.periodEnd && r.date <= today();
  out.push(dateOk ? { ok:true, label:'Collected within reporting period', note:r.date } : { ok:false, label:'Collection date outside period', note:`${r.date || 'No date'} against ${r.periodStart} to ${r.periodEnd}` });
  out.push(r.hash ? { ok:true, label:'Sealed on creation', note:`SHA-256 ${r.hash.slice(0,16)}…` } : { ok:null, label:'Not sealed', note:'' });
  return out;
}
const flagCount = r => checks(r).filter(c => c.ok === false).length;
function spark(vals, color){
  const w=120,h=36,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/span)*(h-6)-3}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/></svg>`;
}

/* Topographic background, generated as an SVG data URI */
function topoURI(){
  let paths = '';
  for (let i = 0; i < 16; i++){
    const off = i * 38, amp = 22 + i * 1.5;
    let d = `M -50 ${off}`;
    for (let x = -50; x <= 1500; x += 60){
      const y = off + Math.sin((x + i * 40) / 180) * amp + Math.cos((x - i * 25) / 110) * (amp * 0.4);
      d += ` L ${x} ${y.toFixed(1)}`;
    }
    paths += `<path d="${d}" />`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><g fill="none" stroke="#7fb08f" stroke-opacity=".16" stroke-width="1.2">${paths}</g></svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
function artURI(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE6F2"/><stop offset=".6" stop-color="#EEF5EC"/><stop offset="1" stop-color="#F7F3E6"/></linearGradient></defs>
    <rect width="1200" height="1000" fill="url(#sky)"/>
    <circle cx="880" cy="250" r="90" fill="#F6DFA2" opacity=".9"/>
    <path d="M0 560 C200 470 360 500 520 540 S860 470 1200 520 L1200 1000 L0 1000Z" fill="#CFE5C2"/>
    <path d="M0 640 C220 560 420 600 620 650 S980 580 1200 630 L1200 1000 L0 1000Z" fill="#A9D19A"/>
    <path d="M0 740 C260 680 480 720 700 760 S1040 700 1200 735 L1200 1000 L0 1000Z" fill="#7DB779"/>
    <path d="M0 850 C300 800 600 840 900 860 S1100 830 1200 845 L1200 1000 L0 1000Z" fill="#4F9A5E"/>
  </svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}

const CHIP = { 'Demo ready':'ok','Done':'ok','Current':'ok','Validated':'ok','Acknowledged':'ok','Received':'warn','Flagged':'bad','Overdue':'bad','Due soon':'warn','Pending':'mute','Not started':'mute','In progress':'warn','Needs decision':'warn','None':'mute' };
function chip(label, onclick, title){
  return `<button class="chip ${CHIP[label]||'mute'}" onclick="${onclick}" title="${esc(title||'Click to change')}">${esc(label)}</button>`;
}
const cycle = (list, cur) => list[(list.indexOf(cur)+1) % list.length];
function setBuild(i){ S.buildStatus[i] = cycle(BUILD_STATES, S.buildStatus[i]); render(); toast('Status: ' + S.buildStatus[i]); }
function setAlert(i){ S.alerts[i] = cycle(ALERT_STATES, S.alerts[i]); render(); toast('Alert: ' + S.alerts[i]); }
function setBaseline(i){ S.baselineStatus[i] = cycle(BASELINE_STATES, S.baselineStatus[i]); render(); toast('Baseline: ' + S.baselineStatus[i]); }
function setCal(i){ S.calibration[i].status = cycle(CAL_STATES, S.calibration[i].status); render(); toast(`${S.calibration[i].id}: ${S.calibration[i].status}`); }
function calibrateToday(i){
  const c = S.calibration[i];
  c.last = TODAY_ISO();
  c.next = new Date(Date.now() + 90*864e5).toISOString().slice(0,10);
  c.status = 'Current';
  render(); toast(`${c.id} calibrated today`);
}
async function advanceBatch(){
  const b = S.batch;
  if (b.log.length >= BATCH_STAGES.length) return toast('Batch BC-0042 is complete');
  const stage = BATCH_STAGES[b.log.length];
  const prev = b.log.length ? b.log[b.log.length-1].hash : 'GENESIS';
  const hash = await sha256(prev + stage + nowStr());
  b.log.push({ at: nowStr(), stage, hash, by: S.user.role });
  render(); toast(`Recorded: ${stage}`);
}

function exportCsv(){
  const cols = ['uid','id','projectId','type','source','ref','periodStart','periodEnd','plot','value','unit','lat','lon','date','method','collector','status','hash'];
  const extraKeys = [...new Set(S.records.flatMap(r => Object.keys(r.extra||{})))];
  const head = [...cols, ...extraKeys];
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = S.records.map(r => [...cols.map(c => r[c]), ...extraKeys.map(k => (r.extra||{})[k])].map(q).join(','));
  const csv = [head.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ace-records.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV downloaded');
}

/* ---------- Actions ---------- */
async function saveRecord(e){
  e.preventDefault();
  const mode = e.submitter?.value || 'draft';
  const f = new FormData(e.target), d = Object.fromEntries(f.entries());
  const files = [...(e.target.querySelector('input[type=file]')?.files || [])];
  if (!can('create')) return toast('Your role cannot create records');
  if (mode === 'submit'){
    if (!can('submit')) return toast('Your role cannot submit records');
    const req = { periodStart:'Period start', periodEnd:'Period end', plot:'Plot or sample ID', date:'Date collected', value:'Measured value', unit:'Unit', lat:'Latitude', lon:'Longitude', method:'Method', collector:'Collector', ref:'Source reference' };
    const missing = Object.keys(req).filter(k => !String(d[k]||'').trim()).map(k => req[k]);
    if (missing.length) return formMsg('Missing: ' + missing.join(', '));
    if (isNaN(+d.value)) return formMsg('Measured value must be a number');
    const lat = +d.lat, lon = +d.lon;
    if (isNaN(lat) || lat < -90 || lat > 90 || isNaN(lon) || lon < -180 || lon > 180) return formMsg('Coordinates are out of range');
    if (d.periodEnd < d.periodStart) return formMsg('Period end must be after period start');
    if (!d.consent) return formMsg('Confirm community consent before submitting');
  }
  const extra = {};
  for (const el of e.target.querySelectorAll('[data-extra]')){ const k = el.dataset.extra; const v = el.value.trim(); if (v) extra[k] = el.dataset.kind === 'number' ? (isNaN(+v) ? v : +v) : v; }
  if (mode === 'submit'){ const tplName = (PROJECTS.find(p => p.id === d.projectId)||{}).tpl; const tpl = TEMPLATES[tplName] || {fields:[]}; const miss = tpl.fields.filter(([k]) => extra[k] === undefined).map(f => f[1]); if (miss.length) return formMsg('Missing template fields: ' + miss.join(', ')); }
  const id = 'MRV-' + S.nextId++;
  const rec = {
    id, uid: newUid(), extra, projectId:d.projectId, type:d.type, source:d.source, ref:d.ref||'', periodStart:d.periodStart||'', periodEnd:d.periodEnd||'',
    plot:d.plot||'', value:d.value||'', unit:d.unit||'', lat:+d.lat||0, lon:+d.lon||0, date:d.date||'',
    method:d.method||'', collector:d.collector||'', notes:d.notes||'',
    evidence: files.map(x => ({ name:x.name, type:x.type, url:URL.createObjectURL(x) })),
    status: mode==='submit' ? 'submitted' : 'draft',
    history: [[nowStr(), S.user.role, mode==='submit' ? 'Submitted' : 'Saved draft', '']]
  };
  S.records.push(rec);
  const prevRec = sorted().slice(0,-1).pop();
  rec.prevHash = prevRec ? prevRec.hash : 'GENESIS';
  rec.hash = await sha256(rec.prevHash + payload(rec));
  S.sel = id; S.route = 'record'; S.prefProject = null;
  S.integrity = { state:'idle', detail:'New record sealed. Verify to confirm the chain.' };
  toast(mode==='submit' ? `${id} submitted and checked` : `${id} saved as draft`);
  render();
}
function submitExisting(id){
  const r = find(id);
  if (!r || !can('submit')) return toast('Your role cannot submit records');
  if (r.status !== 'draft' && r.status !== 'changes') return;
  r.history.push([nowStr(), S.user.role, r.status==='changes'?'Resubmitted':'Submitted', '']);
  r.status = 'submitted';
  toast(`${id} sent to verifier`); render();
}
function review(id, act){
  const r = find(id);
  if (!r || r.status !== 'submitted') return;
  if (!can('review')) return toast('Verifier or admin only');
  const note = ($('revNote')?.value || '').trim();
  if ((act==='changes' || act==='reject') && !note) return toast('Add a note explaining the decision');
  const map = { approve:['verified','Verified'], changes:['changes','Requested changes'], reject:['rejected','Rejected'] };
  const [st, label] = map[act];
  r.status = st; r.history.push([nowStr(), S.user.role, label, note]);
  toast(`${id}: ${label.toLowerCase()}`); render();
}
function addEvidence(id){
  const r = find(id), files = [...($('addFiles')?.files || [])];
  if (!r || !files.length) return toast('Choose a file first');
  if (!can('submit') || (r.status!=='draft' && r.status!=='changes')) return toast('Evidence can be added to drafts or records with changes requested');
  files.forEach(x => r.evidence.push({ name:x.name, type:x.type, url:URL.createObjectURL(x) }));
  r.history.push([nowStr(), S.user.role, 'Evidence added', files.map(x => x.name).join(', ')]);
  toast(`${files.length} file(s) attached`); render();
}
async function runVerify(){
  const res = await verifyChain();
  S.integrity = res.ok ? { state:'ok', detail:`All ${res.count} records verified in order. No data has changed since sealing.` } : { state:'bad', detail:`${res.id}: ${res.why}. Treat later records as untrusted until investigated.` };
  toast(res.ok ? 'Chain intact' : `Tampering detected at ${res.id}`); render();
}
function simulateTamper(){
  if (S.tampered) return toast('Already tampered. Restore first.');
  const r = S.records.find(x => x.status==='verified') || S.records[0];
  S.tampered = { id:r.id, value:r.value };
  r.value = (+r.value * 1.4).toFixed(1);
  S.integrity = { state:'idle', detail:`Value in ${r.id} changed directly in the database. Run verification.` };
  toast(`Edited ${r.id} without resealing`); render();
}
function restoreTamper(){
  if (!S.tampered) return;
  find(S.tampered.id).value = S.tampered.value; S.tampered = null;
  S.integrity = { state:'idle', detail:'Original data restored. Run verification again.' };
  toast('Original data restored'); render();
}
function go(v){ S.route = v; if (v!=='entry') S.prefProject = null; render(); window.scrollTo({top:0}); }
function viewRecord(id){ S.sel = id; S.route = 'record'; render(); window.scrollTo({top:0}); }

/* ---------- Theme: system, day, night, or scheduled ---------- */
const TREE_ICONS = {
  system:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>',
  day:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M3.3 12.7l1.4-1.4M11.3 4.7l1.4-1.4"/></svg>',
  night:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 2a6 6 0 1 0 3.5 10.6A6.5 6.5 0 0 1 10.5 2z"/></svg>',
  auto:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>'
};
const TREE_LABELS = { system:'System', day:'Day', night:'Night', auto:'Schedule' };
function themeTree(compact){
  return `<div class="tree ${compact?'compact':''}" role="radiogroup" aria-label="Theme">
    ${Object.keys(TREE_LABELS).map(m => `<button class="leaf ${S.theme.mode===m?'on':''}" role="radio" aria-checked="${S.theme.mode===m}" onclick="setThemeMode('${m}')">${TREE_ICONS[m]}${compact?'':TREE_LABELS[m]}</button>`).join('')}
  </div>`;
}
function minutesOf(t){ const [h,m] = t.split(':').map(Number); return h*60 + m; }
function resolveTheme(){
  const m = S.theme.mode;
  if (m === 'day') return 'light';
  if (m === 'night') return 'dark';
  if (m === 'system') return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const now = new Date(); const cur = now.getHours()*60 + now.getMinutes();
  const ds = minutesOf(S.theme.dayStart), ns = minutesOf(S.theme.nightStart);
  const isDay = ds < ns ? (cur >= ds && cur < ns) : !(cur >= ns && cur < ds);
  return isDay ? 'light' : 'dark';
}
function applyTheme(){ document.documentElement.dataset.theme = resolveTheme(); }
function setThemeMode(mode){
  S.theme.mode = mode; applyTheme(); render();
  toast(mode === 'auto' ? `Schedule: day ${S.theme.dayStart} to ${S.theme.nightStart}` : `Theme: ${TREE_LABELS[mode]}`);
}
function setSchedule(key, val){ S.theme[key] = val; applyTheme(); render(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
setInterval(() => { if (S.theme.mode === 'auto') applyTheme(); }, 30000);

/* ---------- Splash ---------- */



if (!CanvasRenderingContext2D.prototype.roundRect) { CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h){ this.rect(x,y,w,h); }; }
/* ---------- Splash: ACE grows from a forest, then the full name, 7 seconds ---------- */
(function splash(){
  const DW = 390, DH = 844, DUR = 7.0;
  const canvas = $('splashCanvas'), ctx = canvas.getContext('2d');
  const LET = { A:["01110","10001","10001","11111","10001","10001","10001"],
                C:["01111","10000","10000","10000","10000","10000","01111"],
                E:["11111","10000","10000","11110","10000","10000","11111"] };
  const CELL = 17;
  const targets = []; let x0 = 0;
  for (const ch of 'ACE'){ LET[ch].forEach((row, r) => [...row].forEach((v, c) => { if (v === '1') targets.push([x0 + c, r]); })); x0 += 6; }
  const cols = x0 - 1, ox = (DW - cols*CELL)/2, oy = 250;
  const letterPts = targets.map(([x, y]) => [ox + x*CELL + CELL/2, oy + y*CELL + CELL/2]);
  let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const starts = letterPts.map(() => [14 + rnd()*(DW-28), 640 + rnd()*150]);
  const spots = Array.from({length:30}, () => [14 + rnd()*(DW-28), 630 + rnd()*150, 0.9 + rnd()*0.7]).sort((a,b) => a[1]-b[1]);
  const easeIO = t => { t = Math.max(0, Math.min(1, t)); return t*t*t*(t*(6*t-15)+10); };
  const easeBack = t => { t = Math.max(0, Math.min(1, t)); const c1 = 1.4, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  const COL = { trunk:'#654E38', a:'#2F7D4F', b:'#60A075', ink:'#0E1A14', muted:'#6B7A70', sun:'#F6D68C', gold:'#E0A93B' };

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  }
  function tree(x, y, s, alpha){
    if (s <= 0.02) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COL.trunk; ctx.fillRect(x-1.1*s, y-1*s, 2.2*s, 7*s);
    ctx.fillStyle = COL.a; ctx.beginPath(); ctx.arc(x, y-9*s, 6*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COL.b; ctx.beginPath(); ctx.arc(x-0.8*s, y-13*s, 4.5*s, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function draw(t){
    const vw = innerWidth, vh = innerHeight, dpr = window.devicePixelRatio || 1;
    const k = Math.min(vw/DW, vh/DH);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#F7F3E6'; ctx.fillRect(0,0,vw,vh);
    ctx.setTransform(k*dpr,0,0,k*dpr,(vw-DW*k)/2*dpr,(vh-DH*k)/2*dpr);
    // sky
    const sky = ctx.createLinearGradient(0,0,0,DH);
    sky.addColorStop(0,'#E8F2E9'); sky.addColorStop(1,'#F8F4E8');
    ctx.fillStyle = sky; ctx.fillRect(0,0,DW,DH);
    // sun glow and sun
    const g = ctx.createRadialGradient(300,110,20,300,110,120);
    g.addColorStop(0,'rgba(246,214,140,0.45)'); g.addColorStop(1,'rgba(246,214,140,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,DW,DH);
    ctx.fillStyle = COL.sun; ctx.beginPath(); ctx.arc(300,110,22,0,Math.PI*2); ctx.fill();
    // hills
    const hills = ['#CDE5C0','#A8CF98','#7DB574','#4E985D'];
    hills.forEach((col, i) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, DH);
      const base = 600 + i*62, ph = t*30;
      for (let x = 0; x <= DW; x += 8){
        const y = base + Math.sin((x + ph*(1+i*0.2))/95 + i*1.3)*12 + Math.cos(x/52 + i)*5;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(DW, DH); ctx.closePath(); ctx.fill();
    });
    // 0 to 1.6s: forest sprouts
    if (t < 1.6){
      spots.forEach((p, i) => {
        const gg = easeBack((t - i*0.03)/0.7);
        if (gg > 0) tree(p[0], p[1], p[2]*gg, Math.min(1, gg));
      });
    }
    // 1.4 to 3.8s: trees travel into A C E
    if (t >= 1.4){
      letterPts.forEach(([tx, ty], i) => {
        const [fx, fy] = starts[i];
        const kk = easeIO((t - 1.6 - i*0.012)/1.9);
        const x = fx + (tx-fx)*kk, y = fy + (ty-fy)*kk - Math.sin(kk*Math.PI)*40;
        tree(x, y+8, 1.0, 1);
      });
    }
    // 4.8s onward: full name fades in under ACE
    if (t >= 4.8){
      const a = easeIO((t-4.8)/0.8);
      ctx.globalAlpha = a; ctx.textAlign = 'center';
      ctx.fillStyle = COL.ink; ctx.font = '700 17px Inter, Arial, sans-serif';
      ctx.fillText('African Carbon Exchange', DW/2, 500);
      ctx.fillStyle = COL.muted; ctx.font = '400 13px Inter, Arial, sans-serif';
      ctx.fillText('Field Evidence', DW/2, 528);
      ctx.globalAlpha = 1;
    }
    // progress line
    if (t >= 0.6){
      const p = Math.min(1, (t-0.6)/6.4);
      ctx.fillStyle = '#D6DED4'; ctx.beginPath(); ctx.roundRect(96,780,198,4,2); ctx.fill();
      ctx.fillStyle = COL.gold; ctx.beginPath(); ctx.roundRect(96,780,198*p,4,2); ctx.fill();
    }
  }
  function finish(){
    const el = $('splash');
    el.classList.add('fadeout');
    setTimeout(() => { el.classList.add('hidden'); $('root').classList.add('show'); }, 320);
  }
  const t0 = performance.now();
  function loop(now){
    const t = (now - t0)/1000;
    draw(Math.min(t, DUR));
    if (t < DUR) requestAnimationFrame(loop); else finish();
  }
  resize(); addEventListener('resize', resize);
  requestAnimationFrame(loop);
})();

/* ---------- Render ---------- */
function render(){
  const root = $('root');
  if (!S.authed){ root.innerHTML = loginView(); return; }
  const views = { dashboard, projects, entry, records, record:recordView, audit:auditView, profile, settings, sites:sitesView, baselines:baselinesView, integrity:integrityView, reports:reportsView, status:statusView };
  const focusQ = document.activeElement && document.activeElement.id === 'q';
  root.innerHTML = (views[S.route] || dashboard)();
  if (focusQ){ const q = $('q'); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

/* Live feed updates in place, without re-rendering */
const feed = { f0:186.4, f1:31.2, f2:27.8, f3:82 };
setInterval(() => {
  if (!S.authed || S.route !== 'dashboard') return;
  for (const k in feed){
    if (k === 'f3') feed.f3 = Math.min(100, feed.f3 + (Math.random() < .3 ? 1 : 0));
    else feed[k] = +(feed[k] + (Math.random() - .5) * (k==='f0'?1.6:0.5)).toFixed(1);
    const el = $(k); if (el) el.firstChild.textContent = k === 'f3' ? Math.round(feed.f3) : feed[k].toFixed(1);
  }
}, 2500);

applyTheme();
(async () => { await sealAll(); render(); })();
render();
